<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <title>Order Summary</title>
</head>
<body style="
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    padding: 16px;
    box-sizing: border-box;
    background-color: #E0E8FF;
    font-family: Arial, sans-serif;
">
    <div style=" width: 100%; max-width: 375px; background-color: white; border-radius: 15px; overflow: hidden; text-align: center;">
        <img
            src="illustration-hero.svg"
            alt="Person listening to music"
            style="width: 100%; height: 183px; display: block; object-fit: cover;">
        <div style="padding: 24px 32px 32px;">
            <h2 style="color: #1f2f56; margin: 0 0 16px;">
                Order Summary
            </h2>
            <p style="color: #7280a7; line-height: 1.6; margin: 0 0 24px;">
                You can now listen to millions of songs, audiobooks and podcasts on any device anywhere you like!
            </p>
            <div style=" background-color: #f5f7ff; width: 100%; min-height: 72px;  display: flex; align-items: center; padding: 12px; justify-content: space-between; gap: 10px; box-sizing: border-box; border-radius: 10px; margin-bottom: 24px;">
                <i class="fa-solid fa-music" style=" width: 48px; height: 48px;  border-radius: 50%; background-color: #e0e8ff; color: #3829e0; display: flex; align-items: center; justify-content: center; flex-shrink: 0;"></i>
                <div style=" text-align: left;  flex: 1;">
                    <h4 style="color: #1f2f56; font-size: 14px; margin: 0 0 5px;">
                        Annual Plan
                    </h4>
                    <p style=" color: #7280a7; font-size: 14px; margin: 0;">
                        $59.99/year
                    </p>
                </div>
                <a
                    href="https://arteque.github.io/Order-Summary/#"
                    target="_blank" style=" color: #3829e0; font-size: 13px; font-weight: bold;">
                    Change
                </a>
            </div>
            <button style="border: none; width: 100%; height: 52px; color: white; background-color: #3829e0; border-radius: 10px; cursor: pointer; font-weight: bold;margin-bottom: 16px;
                box-shadow: 0 10px 20px rgba(56, 41, 224, 0.2);">
                Proceed to Payment
            </button>
            <button style=" border: none; background-color: transparent; color: #7280a7; width: 100%; height: 40px; cursor: pointer; font-weight: bold;">
                Cancel Order
            </button>
        </div>
    </div>
</body>
</html>
